[project]
name = "retro-dynamics-api"
version = "0.1.0"
description = "Retro Dynamics Agent backend — dynamic generation, consolidation, and Jira/Azure DevOps integrations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "groq>=0.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout (main.py + routes/, agents/, integrations/ at the app root,
# run directly via `uvicorn main:app`) rather than a conventional
# src/<package> library layout — tell hatchling explicitly which files
# make up the app so `pip install -e ".[dev]"` (used by CI and tests) works.
[tool.hatch.build.targets.wheel]
include = [
    "*.py",
    "agents/**/*.py",
    "routes/**/*.py",
    "integrations/**/*.py",
]
